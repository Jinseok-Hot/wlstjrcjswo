<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에잇퍼센트 투자자 매칭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#a855f7;--purple-dark:#7c3aed;--purple-deep:#5b21b6;
  --indigo:#818cf8;--pink:#f0abfc;
  --grad:linear-gradient(135deg,#a855f7,#818cf8);
  --bg:#f5f0ff;--surface:#fdf6ff;--surface2:#fff;
  --border:#ede9fe;--border2:#ddd6fe;
  --text:#3b0764;--text2:#7c3aed;--text3:#a78bfa;--text4:#c4b5fd;
  --green:#059669;--yellow:#a16207;--orange:#c2410c;--gray:#94a3b8;
  --radius:16px;--radius-sm:10px;
}
body{font-family:'Nunito',-apple-system,sans-serif;background:var(--bg);min-height:100vh;font-size:14px;overflow-x:hidden}

/* ── 파티클 배경 ── */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;border-radius:50%;opacity:0;animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.6}90%{opacity:.3}100%{transform:translateY(-20vh) scale(1.5);opacity:0}}

/* ── 헤더 ── */
header{background:var(--grad);padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(168,85,247,.3)}
.logo-img{width:40px;height:40px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
header h1{font-size:17px;font-weight:900;color:#fff;letter-spacing:-.3px}
header .sub{font-size:12px;color:rgba(255,255,255,.8)}
.header-badge{margin-left:auto;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:20px;font-size:11px;color:#fff;font-weight:700;padding:4px 12px}

/* ── 탭 ── */
.tab-bar{display:flex;background:var(--surface);border-bottom:2px solid var(--border);position:sticky;top:68px;z-index:99}
.tab-btn{flex:1;padding:12px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;border:none;cursor:pointer;background:transparent;color:var(--text3);transition:all .2s;position:relative}
.tab-btn.active{color:var(--purple-dark);background:var(--surface2)}
.tab-btn.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--grad)}

/* ── 단일 조회 레이아웃 ── */
.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 115px)}
aside{background:var(--surface);border-right:2px dashed var(--border);padding:20px;display:flex;flex-direction:column;gap:13px;position:sticky;top:115px;height:calc(100vh - 115px);overflow-y:auto}
.side-title{font-size:10px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:12px;font-weight:700;color:var(--text2)}
select,input[type="number"]{background:var(--surface2);border:2px solid var(--border2);border-radius:var(--radius-sm);color:var(--text2);font-size:12px;font-weight:600;font-family:'Nunito',sans-serif;padding:8px 12px;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none}
select:focus,input[type="number"]:focus{border-color:var(--purple)}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amt-hint{font-size:10px;font-weight:600;color:var(--text3);text-align:right;margin-top:2px;min-height:14px}
.divider{height:1px;background:var(--border)}
.grade-legend{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.grade-legend-title{font-size:10px;font-weight:900;color:var(--text3);text-transform:uppercase;margin-bottom:2px}
.grade-legend-row{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text2)}
.sort-group{display:flex;flex-direction:column;gap:5px}
.btn-search{background:var(--grad);border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:900;font-family:'Nunito',sans-serif;padding:12px;width:100%;cursor:pointer;transition:opacity .15s,transform .1s;letter-spacing:.01em}
.btn-search:hover{opacity:.88}
.btn-search:active{transform:scale(.98)}
.btn-reset{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius-sm);color:var(--text3);font-size:12px;font-weight:700;font-family:'Nunito',sans-serif;padding:8px;width:100%;cursor:pointer;transition:border-color .15s}
.btn-reset:hover{border-color:var(--purple)}

/* ── 메인 영역 ── */
main{padding:20px 24px;overflow-y:auto}

/* 결과 헤더 */
.results-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.results-title{font-size:15px;font-weight:900;color:var(--purple-dark);flex:1}
.count-pill{background:#ede9fe;border:1.5px solid var(--text4);border-radius:20px;font-size:13px;font-weight:900;color:var(--purple-dark);padding:3px 14px}

/* 경고 배너 */
.warn-banner{background:#fef9c3;border:1.5px solid #fde68a;border-radius:var(--radius-sm);padding:10px 14px;font-size:11px;font-weight:700;color:#a16207;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}

/* 빈 상태 */
.state-box{text-align:center;padding:80px 24px}
.state-box .icon{font-size:50px;margin-bottom:14px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.state-box p{font-size:15px;font-weight:700;line-height:2;color:var(--text3)}

/* 카드 */
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;transition:border-color .2s,transform .2s,box-shadow .2s;opacity:0;transform:translateX(-30px)}
.card:hover{border-color:var(--text4);transform:translateX(4px);box-shadow:0 4px 20px rgba(168,85,247,.15)}
.card.show{animation:slideIn .4s ease forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.card.top{border-color:#c084fc;background:linear-gradient(135deg,#fdf4ff,#ede9fe)}
.card.grade-dim{opacity:.65}

.rank-badge{position:absolute;top:-10px;left:14px;background:var(--purple);color:#fff;font-size:10px;font-weight:900;padding:2px 12px;border-radius:20px}
.rank-badge.silver{background:var(--indigo)}
.rank-badge.bronze{background:#fb923c}
.grade-badge{position:absolute;top:-10px;right:14px;font-size:10px;font-weight:900;padding:2px 10px;border-radius:20px}
.grade-badge.g1{background:#dcfce7;color:#15803d;border:1.5px solid #86efac}
.grade-badge.g2{background:#fef9c3;color:#a16207;border:1.5px solid #fde68a}
.grade-badge.g3{background:#ffedd5;color:#c2410c;border:1.5px solid #fdba74}
.grade-badge.g4{background:#f1f5f9;color:#94a3b8;border:1.5px solid #e2e8f0}

.card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:900;flex-shrink:0;animation:pulse 3s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,.4)}50%{box-shadow:0 0 0 6px rgba(168,85,247,0)}}
.inv-name{font-size:14px;font-weight:900;color:var(--text);line-height:1.3;flex:1}
.latest-date{font-size:10px;color:var(--text3);font-weight:600;text-align:right;white-space:nowrap}

.type-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.type-tag{border-radius:6px;padding:2px 8px;font-size:10px;font-weight:900}
.type-tag.신규{background:#ede9fe;color:var(--purple-dark)}
.type-tag.연장{background:#dcfce7;color:#15803d}
.type-tag.후취{background:#fef9c3;color:#a16207}
.type-tag.지분{background:#fce7f3;color:#be185d}

.card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat{background:#f5f3ff;border-radius:var(--radius-sm);padding:9px 8px;text-align:center}
.stat-val{font-size:15px;font-weight:900;color:var(--purple-dark);display:block;margin-bottom:2px}
.stat-val.green{color:var(--green)}
.stat-val.yellow{color:var(--yellow)}
.stat-val.orange{color:var(--orange)}
.stat-val.gray{color:var(--gray)}
.stat-label{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.meta-item{background:#f5f3ff;border-radius:8px;padding:7px 10px}
.meta-label{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;margin-bottom:2px}
.meta-val{font-size:12px;font-weight:700;color:var(--purple-deep)}

.region-label{font-size:9px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.regions{display:flex;flex-wrap:wrap;gap:4px}
.region-tag{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:600;color:#64748b}
.region-tag.match{background:#ede9fe;border-color:var(--text4);color:var(--purple-dark)}

/* ── 배치 조회 ── */
#panel-batch{padding:20px 24px;display:none}
.batch-top{display:flex;gap:12px;margin-bottom:16px}
.batch-textarea{background:var(--surface2);border:2px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:12px;font-weight:600;font-family:'Nunito',monospace;padding:12px;width:100%;resize:vertical;min-height:100px;outline:none;line-height:1.8;flex:1}
.batch-textarea:focus{border-color:var(--purple)}
.batch-sidebar{display:flex;flex-direction:column;gap:8px;width:200px;flex-shrink:0}
.batch-hint{background:#f5f3ff;border-radius:var(--radius-sm);padding:10px 12px;font-size:10px;color:var(--purple-dark);font-weight:600;line-height:1.9}

/* 배치 결과 그리드 */
.batch-results-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.batch-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.batch-card{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);padding:14px 16px;opacity:0;transform:translateY(20px) scale(.96);transition:opacity .35s ease,transform .35s ease}
.batch-card.show{opacity:1;transform:translateY(0) scale(1)}
.batch-card:hover{border-color:var(--text4);box-shadow:0 4px 20px rgba(168,85,247,.12)}
.batch-num{font-size:10px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.batch-cond{font-size:11px;font-weight:700;color:var(--purple-deep);background:#f5f3ff;border-radius:6px;padding:4px 8px;display:inline-block;margin-bottom:10px}
.batch-inv-list{display:flex;flex-wrap:wrap;gap:5px}
.batch-inv-tag{border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800;cursor:default;transition:transform .15s}
.batch-inv-tag:hover{transform:scale(1.05)}
.batch-inv-tag.g1{background:#dcfce7;border:1.5px solid #86efac;color:#15803d}
.batch-inv-tag.g2{background:#fef9c3;border:1.5px solid #fde68a;color:#a16207}
.batch-inv-tag.g3{background:#ffedd5;border:1.5px solid #fdba74;color:#c2410c}
.batch-inv-tag.g4{background:#f1f5f9;border:1.5px solid #e2e8f0;color:#94a3b8}
.batch-none{color:var(--text3);font-size:11px;font-weight:700}
.batch-error-tag{color:#ef4444;font-size:11px;font-weight:700}

/* 카운터 */
.counter-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.counter-box{background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.counter-num{font-size:20px;font-weight:900;color:var(--purple-dark);display:block}
.counter-lbl{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- 파티클 배경 -->
<div class="particles" id="particles"></div>

<header>
  <img class="logo-img" src="LOGO_B64_PLACEHOLDER" alt="에잇퍼센트">
  <h1>투자자 매칭 🎯✨</h1>
  <span class="sub">법인 투자자 조회</span>
  <div class="header-badge" id="data-badge">📅 2026.04–06 · 70명</div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-single" onclick="switchTab('single')">🔍 단일 조회</button>
  <button class="tab-btn" id="tab-batch" onclick="switchTab('batch')">📋 배치 조회</button>
</div>

<!-- 단일 조회 -->
<div id="panel-single">
<div class="layout">
  <aside>
    <div class="side-title">🗂️ 상품 조건 입력</div>
    <div class="form-group">
      <label class="form-label">🏷️ 상품 유형</label>
      <select id="sel-type">
        <option value="">-- 선택해주세요 --</option>
        <option value="신규">🏠 신규 (규제 적용)</option>
        <option value="후취">✨ 후취담보 (비규제)</option>
        <option value="연장">🔄 연장 (비규제)</option>
        <option value="지분">🤝 지분대출 (규제 적용)</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">📍 지역</label>
      <select id="sel-large" onchange="updateDetail()">
        <option value="">-- 광역시도 --</option>
      </select>
      <select id="sel-detail" style="margin-top:6px">
        <option value="">-- 시/군/구 (선택) --</option>
      </select>
    </div>
    <div class="divider"></div>
    <div class="form-group">
      <label class="form-label">💹 수익률 (%)</label>
      <input type="number" id="inp-rate" placeholder="예: 9.5" step="0.1">
    </div>
    <div class="input-row">
      <div class="form-group">
        <label class="form-label">📉 유효담보비율 (%)</label>
        <input type="number" id="inp-ltve" placeholder="예: 45" step="0.1">
      </div>
      <div class="form-group">
        <label class="form-label">📊 담보인정비율 (%)</label>
        <input type="number" id="inp-ltvr" placeholder="예: 60" step="0.1">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">💰 모집금액 (백만원)</label>
      <input type="number" id="inp-amt" placeholder="예: 100" step="1">
      <div class="amt-hint" id="amt-hint">—</div>
    </div>
    <div class="grade-legend" id="grade-legend" style="display:none">
      <div class="grade-legend-title">💡 투자 가능 등급 기준</div>
      <div class="grade-legend-row">🟢 <span id="leg-g1">—</span></div>
      <div class="grade-legend-row">🟡 <span id="leg-g2">—</span></div>
      <div class="grade-legend-row">🟠 <span id="leg-g3">—</span></div>
      <div class="grade-legend-row">⚪ <span id="leg-g0">—</span></div>
    </div>
    <div class="sort-group">
      <label class="form-label">🔀 정렬 기준</label>
      <select id="sort-sel" onchange="renderResults()">
        <option value="amount">💰 총 투자금액</option>
        <option value="date">📅 최근 투자일</option>
        <option value="count">📊 투자건수</option>
      </select>
    </div>
    <button class="btn-search" onclick="runSearch()">🔍 투자자 찾기! 🚀</button>
    <button class="btn-reset" onclick="resetAll()">↺ 초기화</button>
  </aside>
  <main id="main-area">
    <div class="state-box">
      <div class="icon">🎮</div>
      <p>상품 조건을 입력하고<br>투자자를 찾아보세요! 🚀✨</p>
    </div>
  </main>
</div>
</div>

<!-- 배치 조회 -->
<div id="panel-batch" style="display:none">
  <div class="batch-top">
    <textarea class="batch-textarea" id="batch-input" placeholder="📌 슬래시 형식: 신규/서울특별시/강남구/9.5/45/60/100&#10;📌 엑셀 복붙: 행 선택 후 그대로 붙여넣기 (탭 구분 자동 인식)&#10;&#10;여러 줄 입력 가능해요! 😊" spellcheck="false"></textarea>
    <div class="batch-sidebar">
      <div class="batch-hint">
        📌 <b>슬래시 형식</b><br>
        유형/광역시도/시군구/<br>수익률/유효담보/<br>담보인정/모집금액(백만)<br><br>
        📌 <b>엑셀 복붙</b><br>
        순번·ID·이름·대출구분·<b>종류</b>·<b>물건지</b>·면적·<b>대출금액</b>·<b>금리</b>·기간·시세·시세구분·<b>LTV</b>
      </div>
      <button class="btn-search" onclick="runBatch()">📋 배치 조회! 🎯</button>
      <button class="btn-reset" onclick="document.getElementById('batch-input').value='';document.getElementById('batch-result-area').innerHTML=''">↺ 초기화</button>
    </div>
  </div>
  <div id="batch-result-area"></div>
</div>

<script>
const RAW = DATA_JSON_PLACEHOLDER;
const INVESTORS = RAW.investors;
const REGION_MAP = RAW.region_map;

// ── 파티클 생성 ──
function createParticles(){
  const wrap = document.getElementById('particles');
  const colors = ['#c084fc','#a78bfa','#f0abfc','#818cf8','#e879f9'];
  for(let i=0;i<25;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*8+4;
    p.style.cssText = `
      width:${size}px;height:${size}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      left:${Math.random()*100}%;
      animation-duration:${Math.random()*15+10}s;
      animation-delay:${Math.random()*10}s;
    `;
    wrap.appendChild(p);
  }
}
createParticles();

// ── 지역 드롭다운 ──
const selLarge = document.getElementById('sel-large');
const selDetail = document.getElementById('sel-detail');
Object.keys(REGION_MAP).sort().forEach(r=>{
  const o=document.createElement('option'); o.value=r; o.textContent=r; selLarge.appendChild(o);
});
function updateDetail(){
  const v=selLarge.value;
  selDetail.innerHTML='<option value="">-- 시/군/구 (선택) --</option>';
  if(!v)return;
  (REGION_MAP[v]||[]).forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;selDetail.appendChild(o);});
}

// ── 모집금액 힌트 ──
document.getElementById('inp-amt').addEventListener('input',function(){
  const v=parseFloat(this.value), hint=document.getElementById('amt-hint'), legend=document.getElementById('grade-legend');
  if(isNaN(v)||v<=0){hint.textContent='—';legend.style.display='none';return;}
  const won=v*1e6;
  hint.textContent='총 '+fmtFull(won)+' → 40% = '+fmtFull(won*.4);
  document.getElementById('leg-g1').textContent='1순위: '+fmtFull(won*.4)+' 이상 (40%)';
  document.getElementById('leg-g2').textContent='2순위: '+fmtFull(won*.2)+' 이상 (20%)';
  document.getElementById('leg-g3').textContent='3순위: '+fmtFull(won*.1)+' 이상 (10%)';
  document.getElementById('leg-g0').textContent='참고: 그 이하';
  legend.style.display='flex';
});

// ── 유틸 ──
function fmt(n){if(n>=1e8)return(n/1e8).toFixed(1)+'억';if(n>=1e4)return Math.round(n/1e4)+'만';return n.toLocaleString();}
function fmtFull(n){if(n>=1e8){const b=Math.floor(n/1e8),m=Math.round((n%1e8)/1e4);return m>0?b+'억 '+m+'만':b+'억';}if(n>=1e4)return Math.round(n/1e4)+'만';return n.toLocaleString()+'원';}
function initial(name){return name.replace(/주식회사|유한회사|유한책임회사|\(주\)|㈜/g,'').trim().charAt(0)||'?';}
function getGrade(maxSingle,amt){
  if(!amt||isNaN(amt)||amt<=0)return null;
  if(maxSingle>=amt*.4)return 1;
  if(maxSingle>=amt*.2)return 2;
  if(maxSingle>=amt*.1)return 3;
  return 4;
}
const GRADE_INFO={1:{cls:'g1',label:'🟢 1순위 (40%+)'},2:{cls:'g2',label:'🟡 2순위 (20%+)'},3:{cls:'g3',label:'🟠 3순위 (10%+)'},4:{cls:'g4',label:'⚪ 참고'}};

// ── 탭 전환 ──
function switchTab(tab){
  document.getElementById('panel-single').style.display = tab==='single'?'':'none';
  document.getElementById('panel-batch').style.display  = tab==='batch' ?'':'none';
  document.getElementById('tab-single').classList.toggle('active',tab==='single');
  document.getElementById('tab-batch').classList.toggle('active', tab==='batch');
}

// ── 단일 검색 ──
let lastResults=[], lastInput={};

function runSearch(){
  const type=document.getElementById('sel-type').value;
  const large=selLarge.value, detail=selDetail.value;
  const rate=parseFloat(document.getElementById('inp-rate').value);
  const ltve=parseFloat(document.getElementById('inp-ltve').value);
  const ltvr=parseFloat(document.getElementById('inp-ltvr').value);
  const amtMil=parseFloat(document.getElementById('inp-amt').value);
  const amt=isNaN(amtMil)?NaN:amtMil*1e6;
  const hasAmt=!isNaN(amt)&&amt>0;
  if(!type){alert('상품 유형을 선택해주세요! 🎯');return;}
  if(!large){alert('지역을 선택해주세요! 📍');return;}
  lastInput={type,large,detail,rate,ltve,ltvr,amt};
  lastResults=INVESTORS.filter(inv=>{
    if(!inv.types.includes(type))return false;
    const rm=inv.regions.some(r=>{if(r.large!==large)return false;if(detail&&r.detail!==detail)return false;return true;});
    if(!rm)return false;
    if(!isNaN(rate)&&rate<inv.rate_min)return false;
    if(!isNaN(ltve)&&ltve>inv.ltv_eff_max)return false;
    if(!isNaN(ltvr)&&ltvr>inv.ltv_rec_max)return false;
    return true;
  });
  // 등급 정렬 옵션
  const sortSel=document.getElementById('sort-sel');
  const hasGradeOpt=Array.from(sortSel.options).some(o=>o.value==='grade');
  if(hasAmt&&!hasGradeOpt){const opt=document.createElement('option');opt.value='grade';opt.textContent='🎯 투자 가능 등급';sortSel.insertBefore(opt,sortSel.firstChild);sortSel.value='grade';}
  else if(!hasAmt&&hasGradeOpt){Array.from(sortSel.options).forEach(o=>{if(o.value==='grade')sortSel.removeChild(o);});if(sortSel.value==='grade')sortSel.value='amount';}
  renderResults();
}

function sortArr(arr,key,amt){
  return [...arr].sort((a,b)=>{
    if(key==='grade'){const ga=getGrade(a.max_single,amt)??5,gb=getGrade(b.max_single,amt)??5;if(ga!==gb)return ga-gb;return b.total_amt-a.total_amt;}
    if(key==='date')return b.latest_date.localeCompare(a.latest_date);
    if(key==='amount')return b.total_amt-a.total_amt;
    if(key==='count')return b.total_count-a.total_count;
    return 0;
  });
}

function renderResults(){
  const sortKey=document.getElementById('sort-sel').value;
  const {type,large,detail}=lastInput;
  const amtMilNow=parseFloat(document.getElementById('inp-amt').value);
  const amt=isNaN(amtMilNow)?NaN:amtMilNow*1e6;
  const hasAmt=!isNaN(amt)&&amt>0;
  const sorted=sortArr(lastResults,sortKey,amt);
  const isReg=type==='신규'||type==='지분';
  const ranks=['🥇','🥈','🥉'];
  let html='';

  // 카운터 애니메이션
  html+=`<div class="counter-wrap">
    <div class="counter-box"><span class="counter-num" id="cnt-match">0</span><span class="counter-lbl">🧑‍💼 매칭 투자자</span></div>
    <div class="counter-box"><span class="counter-num" id="cnt-total">0억</span><span class="counter-lbl">💰 총 투자금액</span></div>
    <div class="counter-box"><span class="counter-num" id="cnt-deals">0건</span><span class="counter-lbl">📋 총 투자건수</span></div>
  </div>`;

  html+=`<div class="results-header">
    <div class="results-title">✅ 매칭 결과</div>
    <div class="count-pill">🧑‍💼 ${sorted.length}명</div>
  </div>`;

  if(isReg) html+=`<div class="warn-banner">⚠️ <span><b>${type} 상품</b>은 규제 적용 구간이에요. 담보비율 필터는 참고용으로만 활용해주세요!</span></div>`;

  if(sorted.length===0){
    html+=`<div class="state-box"><div class="icon">😢</div><p>조건에 맞는 투자자가 없어요.<br>조건을 조금 완화해보세요! 🙏</p></div>`;
    document.getElementById('main-area').innerHTML=html;
    return;
  }

  html+='<div class="cards">';
  sorted.forEach((inv,i)=>{
    const grade=hasAmt?getGrade(inv.max_single,amt):null;
    const gradeInfo=grade!==null?GRADE_INFO[grade]:null;
    const matchSet=new Set(inv.regions.filter(r=>{if(r.large!==large)return false;if(detail&&r.detail!==detail)return false;return true;}).map(r=>r.large+r.detail));
    const sortedRegions=[...inv.regions].sort((a,b)=>(matchSet.has(a.large+a.detail)?0:1)-(matchSet.has(b.large+b.detail)?0:1));
    const regionHtml=sortedRegions.slice(0,10).map(r=>{
      const isM=matchSet.has(r.large+r.detail);
      const label=r.large===r.detail?r.large:r.large.replace('특별시','').replace('광역시','').replace('특별자치시','').replace('특별자치도','').replace('도','').trim()+' '+r.detail;
      return `<span class="region-tag ${isM?'match':''}">${isM?'📍 ':''}${label}</span>`;
    }).join('')+(sortedRegions.length>10?`<span class="region-tag">+${sortedRegions.length-10}개</span>`:'');
    const typeHtml=inv.types.map(t=>`<span class="type-tag ${t}">${t==='신규'?'🏠':t==='연장'?'🔄':t==='후취'?'✨':'🤝'} ${t}</span>`).join('');
    const dimCard=grade===4;
    let singleValClass='';
    if(grade===1)singleValClass='green';else if(grade===2)singleValClass='yellow';else if(grade===3)singleValClass='orange';else if(grade===4)singleValClass='gray';
    html+=`<div class="card ${i===0&&!dimCard?'top':''} ${dimCard?'grade-dim':''}" style="animation-delay:${i*0.08}s">
      ${i<3?`<div class="rank-badge ${i===1?'silver':i===2?'bronze':''}">${ranks[i]}${i===0?' TOP MATCH':''}</div>`:''}
      ${gradeInfo?`<div class="grade-badge ${gradeInfo.cls}">${gradeInfo.label}</div>`:''}
      <div style="height:${i<3||gradeInfo?'8px':'4px'}"></div>
      <div class="card-top">
        <div class="avatar">${initial(inv.name)}</div>
        <div style="flex:1"><div class="inv-name">${inv.name}</div><div class="type-tags">${typeHtml}</div></div>
        <div class="latest-date">🕐 최근 투자<br>${inv.latest_date}</div>
      </div>
      <div class="card-stats">
        <div class="stat"><span class="stat-val">💰 ${fmt(inv.total_amt)}</span><span class="stat-label">총 투자금액</span></div>
        <div class="stat"><span class="stat-val">📋 ${inv.total_count}건</span><span class="stat-label">총 건수</span></div>
        <div class="stat"><span class="stat-val ${singleValClass}">🎯 ${fmtFull(inv.max_single)}</span><span class="stat-label">최대 단일${hasAmt&&grade===1?' ✅':''}</span></div>
      </div>
      <div class="card-meta">
        <div class="meta-item"><div class="meta-label">💹 수익률 범위</div><div class="meta-val">${inv.rate_min}% – ${inv.rate_max}%</div></div>
        <div class="meta-item"><div class="meta-label">📉 유효담보비율 최대</div><div class="meta-val">${inv.ltv_eff_max}%</div></div>
        <div class="meta-item"><div class="meta-label">📊 담보인정비율 최대</div><div class="meta-val">${inv.ltv_rec_max}%</div></div>
        <div class="meta-item"><div class="meta-label">🗺️ 투자 지역 수</div><div class="meta-val">${inv.regions.length}개 지역</div></div>
      </div>
      <div class="region-label">🗺️ 투자 지역 이력</div>
      <div class="regions">${regionHtml}</div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('main-area').innerHTML=html;

  // 카운터 애니메이션 실행
  const totalAmt=sorted.reduce((s,inv)=>s+inv.total_amt,0);
  const totalDeals=sorted.reduce((s,inv)=>s+inv.total_count,0);
  animateCounter('cnt-match',sorted.length,'명',600);
  animateCounter('cnt-total',Math.round(totalAmt/1e8),'억',800);
  animateCounter('cnt-deals',totalDeals,'건',700);
}

function animateCounter(id,target,suffix,dur){
  const el=document.getElementById(id); if(!el)return;
  let start=null;
  const step=ts=>{
    if(!start)start=ts;
    const prog=Math.min((ts-start)/dur,1);
    el.textContent=Math.round(prog*target)+suffix;
    if(prog<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function resetAll(){
  document.getElementById('sel-type').value='';
  selLarge.value=''; selDetail.innerHTML='<option value="">-- 시/군/구 (선택) --</option>';
  ['inp-rate','inp-ltve','inp-ltvr','inp-amt'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('amt-hint').textContent='—';
  document.getElementById('grade-legend').style.display='none';
  const sortSel=document.getElementById('sort-sel');
  Array.from(sortSel.options).forEach(o=>{if(o.value==='grade')sortSel.removeChild(o);});
  sortSel.value='amount';
  lastResults=[]; lastInput={};
  document.getElementById('main-area').innerHTML=`<div class="state-box"><div class="icon">🎮</div><p>상품 조건을 입력하고<br>투자자를 찾아보세요! 🚀✨</p></div>`;
}

// ── 배치 조회 ──
const TYPE_MAP={'신규':'신규','일반':'신규','후취':'후취','연장':'연장','지분':'지분'};

function parseBatchLine(line){
  const cleaned=line.replace(/^\s*\d+[\.)]\s*/,'').trim();
  if(!cleaned)return null;
  const tabs=(cleaned.match(/\t/g)||[]).length;
  if(tabs>=3)return parseExcelLine(cleaned);
  const parts=cleaned.split('/').map(p=>p.trim());
  if(parts.length<4)return{error:'컬럼 부족 (최소 4개 필요)'};
  const[typeRaw,large,detail,rateRaw,ltveRaw,ltvrRaw,amtRaw]=parts;
  const type=TYPE_MAP[typeRaw];
  if(!type)return{error:`유형 인식 불가: "${typeRaw}"`};
  if(!large)return{error:'광역시도 없음'};
  return{type,large,detail:detail||'',rate:parseFloat(rateRaw)||NaN,ltve:parseFloat(ltveRaw)||NaN,ltvr:parseFloat(ltvrRaw)||NaN,amt:amtRaw?parseFloat(amtRaw.replace(/,/g,''))*1e6:NaN};
}

function parseExcelLine(line){
  const cols=line.split('\t').map(c=>c.trim());
  if(cols.length<9)return{error:'엑셀 컬럼 부족'};
  const type=TYPE_MAP[(cols[4]||'').replace(/\s/g,'')];
  if(!type)return{error:`종류 인식 불가: "${cols[4]}"`};
  const{large,detail}=parseAddr(cols[5]||'');
  if(!large)return{error:`주소 파싱 실패: "${cols[5]}"`};
  const amt=parseFloat((cols[7]||'').replace(/[,\s]/g,''))||NaN;
  const rate=parseFloat((cols[8]||'').replace('%',''))||NaN;
  const ltvRaw=cols[12]||'';
  const ltve=ltvRaw?parseFloat(ltvRaw.replace('%',''))||NaN:NaN;
  return{type,large,detail,rate,ltve,ltvr:NaN,amt,ltvMissing:!ltvRaw};
}

function parseAddr(addr){
  const parts=addr.split(' ');
  if(!parts.length)return{large:'',detail:''};
  const large=parts[0]; let detail='';
  for(let i=1;i<parts.length;i++){if(parts[i].endsWith('구')||parts[i].endsWith('시')||parts[i].endsWith('군')){detail=parts[i];break;}}
  return{large,detail};
}

function filterInvestors(cond){
  const{type,large,detail,rate,ltve,ltvr}=cond;
  return INVESTORS.filter(inv=>{
    if(!inv.types.includes(type))return false;
    const rm=inv.regions.some(r=>{if(r.large!==large)return false;if(detail&&r.detail!==detail)return false;return true;});
    if(!rm)return false;
    if(!isNaN(rate)&&rate<inv.rate_min)return false;
    if(!isNaN(ltve)&&ltve>inv.ltv_eff_max)return false;
    if(!isNaN(ltvr)&&ltvr>inv.ltv_rec_max)return false;
    return true;
  });
}

function runBatch(){
  const raw=document.getElementById('batch-input').value;
  const lines=raw.split('\n').filter(l=>l.trim());
  if(!lines.length){alert('내용을 입력해주세요! 📝');return;}
  let lineNum=0, html='';
  const allCards=[];

  lines.forEach(line=>{
    if(!line.trim())return;
    lineNum++;
    const cond=parseBatchLine(line);
    if(!cond)return;
    if(cond.error){
      allCards.push(`<div class="batch-card"><div class="batch-num">📌 ${lineNum}번</div><div class="batch-error-tag">⚠️ ${cond.error}</div></div>`);
      return;
    }
    const results=filterInvestors(cond);
    const sorted=[...results].sort((a,b)=>{
      const ga=getGrade(a.max_single,cond.amt)??5, gb=getGrade(b.max_single,cond.amt)??5;
      if(ga!==gb)return ga-gb; return b.total_amt-a.total_amt;
    });
    const ltvWarn=cond.ltvMissing?'<span style="color:#ef4444;font-size:10px;font-weight:800;margin-left:6px">⚠️ LTV없음·담보비율필터미적용</span>':'';
    const condLabel=[
      cond.type,
      cond.large.replace('특별시','').replace('광역시','').replace('특별자치시','').replace('특별자치도','').replace('도','').trim(),
      cond.detail||'전체',
      !isNaN(cond.rate)?cond.rate+'%':'',
      !isNaN(cond.ltve)?'유효'+cond.ltve+'%':'',
      !isNaN(cond.amt)?fmt(cond.amt):'',
    ].filter(Boolean).join(' · ');
    const invTagsHtml=sorted.length===0
      ?'<span class="batch-none">😢 조건 맞는 투자자 없음</span>'
      :sorted.map(inv=>{
        const g=getGrade(inv.max_single,cond.amt);
        const cls=g===1?'g1':g===2?'g2':g===3?'g3':g===4?'g4':'';
        const emoji=g===1?'🟢':g===2?'🟡':g===3?'🟠':g===4?'⚪':'';
        const shortName=inv.name.replace('주식회사','').replace('(주)','').replace('㈜','').trim();
        return `<span class="batch-inv-tag ${cls}">${emoji} ${shortName}</span>`;
      }).join('');
    allCards.push(`<div class="batch-card"><div class="batch-num">📌 ${lineNum}번 조회</div><div class="batch-cond">${condLabel}${ltvWarn}</div><div class="batch-inv-list">${invTagsHtml}</div></div>`);
  });

  html=`<div class="batch-results-header">
    <div class="results-title">✅ 배치 조회 결과</div>
    <div class="count-pill">📋 ${lineNum}건</div>
  </div><div class="batch-grid">${allCards.join('')}</div>`;
  document.getElementById('batch-result-area').innerHTML=html;

  // 카드 순차 등장 애니메이션
  setTimeout(()=>{
    document.querySelectorAll('.batch-card').forEach((c,i)=>setTimeout(()=>c.classList.add('show'),i*80));
  },50);
}
</script>
</body>
</html>
